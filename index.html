<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">

<title>BETMA ENGLISH</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#D3222B;--deep:#A71920;--lred:#F4DCDD;--pink:#FBEDEE;--gray:#F5F3F2;--dark:#201D1D;--pur:#A71920;--pur2:#D3222B;--lpur:#F4DCDD;--bd:#D9D9D9;--bg:#fff;--tx:#201D1D;--out:#f0b9bb;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--out:#3a1a1c}}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Nunito,'Varela Round','Segoe UI',Arial,sans-serif;color:var(--tx);background:var(--bg);line-height:1.55}
button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}
.lg{height:44px;width:auto;display:block}.ft .lg{background:#fff;padding:6px 10px;border-radius:10px;height:40px}.cbt .lg{height:34px}.logo{display:inline-flex;align-items:center;gap:8px;font-weight:800;border:1.5px dashed currentColor;padding:4px 10px;border-radius:6px;font-size:13px}
.demo{background:var(--dark);color:#fff;font-size:12px;padding:6px 14px;text-align:center}
#gh{position:sticky;top:0;z-index:20;background:#fff}.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:700}.btn.o{background:#fff;color:var(--red);border:1.5px solid var(--red)}
/* HOME */
.home{background:var(--out);padding:20px;min-height:100vh}
.frame{background:#fff;color:#201D1D;max-width:1200px;margin:0 auto;border-radius:32px;box-shadow:0 20px 50px rgba(167,25,32,.15);overflow:hidden}
.hd{display:flex;align-items:center;justify-content:space-between;height:72px;padding:0 32px;position:sticky;top:0;background:#fff;z-index:5;border-bottom:1px solid var(--gray)}
.nav{display:flex;gap:28px;font-weight:700;font-size:14px}.nav a{padding:6px 0;border-bottom:2px solid transparent}.nav a.on{color:var(--red);border-color:var(--red)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;padding:56px 48px;align-items:center}
.hero h1{font-size:clamp(32px,4.4vw,56px);line-height:1.08;margin:12px 0 18px;font-weight:900;letter-spacing:-.5px}.hero h1 em{color:var(--red);font-style:normal}.bm span,.bm em{display:block;width:max-content;white-space:nowrap}.bm .to{font-size:.45em;letter-spacing:.3em;margin:.2em 0 .05em}.bm em{line-height:.95}
.eye{font-size:12px;font-weight:700;color:var(--deep);letter-spacing:.5px}
.col{position:relative;height:420px}.col img{position:absolute;object-fit:cover;border-radius:28px;border:5px solid #fff;box-shadow:0 8px 24px rgba(167,25,32,.18)}.col div{position:absolute;border-radius:28px;background:var(--lred);border:2px dashed var(--red);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--deep);padding:10px}
.stats{display:flex;gap:28px;margin-top:30px}.stats b{font-size:26px;display:block;color:var(--red)}.stats span{font-size:12px}
.sec{padding:48px;border-top:1px solid var(--gray)}.sec h2{font-size:28px;margin:0 0 10px}
.pl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:16px}.pl div{background:var(--pink);border-radius:14px;padding:16px;font-weight:700}.pl small{display:block;font-weight:400;color:#666}
.apt{background:var(--red);color:#fff;border-radius:24px;padding:36px;margin:0 48px 48px}.apt h2{margin:0 0 14px;font-size:30px}
.ft{padding:24px 48px;background:var(--dark);color:#ddd;font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
/* PRACTICE */
.ph{background:var(--pink);color:var(--deep);display:flex;justify-content:space-between;align-items:center;padding:14px 28px;flex-wrap:wrap;gap:10px}.ph nav{display:flex;gap:18px;font-size:14px}.ph nav a{opacity:.7}.ph nav a.on{opacity:1;border-bottom:2px solid var(--red)}
.pg{background:#fff;color:#201D1D;max-width:1200px;margin:20px auto;border-radius:32px;box-shadow:0 20px 50px rgba(167,25,32,.15);overflow:hidden;padding-bottom:40px}.wrap{max-width:1100px;margin:0 auto;padding:24px}
.crumb{font-size:13px;color:#666;margin-bottom:14px}.crumb a{color:var(--red)}
.ph1{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;margin-bottom:28px}.ph1 h1{font-size:34px;line-height:1.1;margin:0 0 12px}
.card{background:#fff;border:1px solid #e6e2e0;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:12px 0 28px}
.bar{height:6px;background:var(--lred);border-radius:4px;margin:10px 0 4px}.bar i{display:block;height:100%;background:var(--red);border-radius:4px}
.ex{display:grid;grid-template-columns:minmax(0,1fr) 305px;gap:20px}
.gap{border:1.5px solid var(--out);border-radius:8px;padding:3px 4px;background:#fff;font:inherit;color:#201D1D}.gap.ok{border-color:#1a8a4a;background:#e8f6ee}.gap.no{border-color:var(--red);background:var(--pink)}
.w{cursor:help}.w:hover{background:var(--lred)}mark{background:#FFF1B8;color:inherit;border-radius:3px;padding:0 2px}.rad{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--out);border-radius:10px;padding:10px 12px;margin:6px 0;color:#201D1D}.rad.on{border-color:var(--red);background:var(--pink)}.rad.ok{border-color:#1a8a4a;background:#e8f6ee}.rad.no{border-color:var(--red);background:var(--pink)}.fb{font-size:14px;margin:8px 0;padding:10px 12px;border-radius:10px}.fb.ok{background:#e8f6ee}.fb.no{background:var(--pink)}
.strat li{margin-bottom:8px}
/* CBT */
.cbt{height:100vh;display:flex;flex-direction:column;background:#fff;font-family:Nunito,'Varela Round','Segoe UI',Arial,sans-serif;color:#171717}
.cbt .top{display:flex;justify-content:flex-end;align-items:center;padding:10px 24px;border-bottom:1px solid var(--bd);gap:16px}.tm{font-size:22px;font-weight:700;color:var(--pur)}
.cbt .mid{flex:1;display:flex;min-height:0}.sb{width:300px;background:#F5F3F2;border-right:1px solid var(--bd);overflow:auto;padding:14px}
.qi{display:flex;justify-content:space-between;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:10px;margin:6px 0;width:100%;text-align:left}.qi.on{border-color:var(--pur2);background:var(--lpur)}
.mn{flex:1;overflow:auto;padding:36px 56px 60px}.mn h2{color:var(--pur);margin-top:0}
.ar{display:flex;gap:14px;border:1px solid var(--bd);border-radius:8px;padding:14px;margin:10px 0;max-width:720px;cursor:pointer;width:100%;background:#fff;text-align:left}.ar b{width:26px}.ar.on{border-color:var(--pur2);background:var(--lpur)}
.bn{display:flex;justify-content:space-between;padding:12px 24px;border-top:1px solid var(--bd);background:#fff}.bn button{border:1px solid var(--bd);background:#fff;border-radius:6px;padding:10px 22px;margin-left:8px}.bn .nx{background:var(--pur);color:#fff;border-color:var(--pur)}
.pb{height:4px;background:var(--lpur)}.pb i{display:block;height:100%;background:var(--pur)}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}.mod div{background:#fff;color:#171717;padding:28px;border-radius:12px;max-width:420px}
input.tx{padding:10px;border:1px solid var(--bd);border-radius:8px;width:100%;max-width:320px;margin:6px 0 12px;display:block;font:inherit}
@media(max-width:800px){.hero,.ph1,.ex{grid-template-columns:1fr}.nav{gap:12px;font-size:12px}.hd,.sec,.hero{padding-left:18px;padding-right:18px}.apt{margin:0 18px 30px}.sb{width:120px;font-size:12px}.mn{padding:20px}.col{height:300px}}
.cbt textarea{width:100%;max-width:720px;min-height:200px;padding:12px;border:1px solid var(--bd);border-radius:8px;font:inherit;display:block}
.sg{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--bd);padding:10px 4px;font-weight:700;display:flex;justify-content:space-between;margin-top:6px}
.bk,.fl{border:1px solid var(--bd);background:#fff;border-radius:6px;padding:6px 12px}.fl.on{background:var(--lpur);border-color:var(--pur2)}
.rp{width:340px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.18);padding:24px;text-align:center;margin:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.ring{width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center}.ring b{background:#fff;width:106px;height:106px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--pur)}
.wf{display:flex;gap:3px;align-items:center;height:60px}.wf i{width:6px;background:var(--pur2);border-radius:3px;height:8px}
.cbt.big .mn{font-size:120%}.bn button:disabled{opacity:.5}
</style></head><body>

<script>
// ---------- DATA (tách khỏi giao diện; thay bằng API/Question Bank khi có backend) ----------
const DB={
 skills:{listening:{name:'Listening',parts:['Information Recognition','Information Matching','Identifying Opinions','Monologue Comprehension']},
  reading:{name:'Reading',parts:['Sentence Comprehension','Text Cohesion','Opinion Matching','Long Text Comprehension']}},
 exercises:[{id:'r1-17',skill:'reading',part:1,title:'Bài 17 · Our new neighbourhood',
  text:['I live in a small town near the sea. After school, my friends and I go to the {1} to play football. On Saturdays, my mum buys fresh bread from the {2} on Green Street. In the evening we {3} dinner together, and my dad {4} the dishes.'],
  gaps:[{o:['park','library','station'],a:0,why:'“after school… play football” → công viên (park).'},
        {o:['bakery','bank','cinema'],a:0,why:'“fresh bread” → tiệm bánh (bakery).'},
        {o:['have','making','eats'],a:0,why:'“we have dinner” → ăn tối; chủ ngữ “we” dùng động từ nguyên mẫu.'},
        {o:['wash','washes','washing'],a:1,why:'chủ ngữ “my dad” (ngôi 3 số ít) → washes.'}]}],
 strategy:{reading:['Đọc cả câu trước khi chọn.','Xác định ngữ cảnh của chỗ trống.','Phân tích ngữ pháp: thì, chủ ngữ, từ loại.','Nhận diện collocation.','Loại trừ đáp án sai.'],listening:['Xác định thông tin cần nghe.','Nhận diện từ khóa.','Chú ý paraphrase.']},
 test:{id:'demo-1',title:'APTIS Mock Test (bản demo)',minutes:10,qs:[
  {t:'She ___ to work by bus every day.',o:['go','goes','going','gone'],a:1},
  {t:'I’m looking forward to ___ you.',o:['see','saw','seeing','seen'],a:2},
  {t:'The meeting was ___ because of the rain.',o:['cancelled','cancel','cancelling','cancels'],a:0},
  {t:'He is ___ than his brother.',o:['tall','taller','tallest','more tall'],a:1},
  {t:'We ___ dinner when the phone rang.',o:['have','had','were having','are having'],a:2}]}
};
const S={get(k,d){try{const v=localStorage.getItem('betma:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('betma:'+k,JSON.stringify(v))}catch(e){}}};
const $=s=>document.querySelector(s);let tick;
const LOGO='<img src="assets/img/logo.png" alt="BETMA ENGLISH" class="lg">';
// ---------- ROUTER ----------
let prev='/';
function area(h){return h.startsWith('/luyen-aptis')?'luyen':h.startsWith('/thi-thu')?'thi':'home'}
function sc(id){const e=document.getElementById(id);e&&e.scrollIntoView({behavior:'smooth'})}
function goContact(ev){ev.preventDefault();if((location.hash||'#/')!=='#/')location.hash='#/';setTimeout(()=>sc('contact'),60)}
function shell(h){const fs=h==='/thi-thu/session',g=$('#gh'),a=area(h);document.querySelector('.demo').style.display=fs?'none':'block';document.body.style.background=fs?'#fff':'var(--out)';g.style.display=fs?'none':'block';
 g.innerHTML=`<header class="hd">${LOGO}<nav class="nav">${[['home','TRANG CHỦ','/'],['luyen','LUYỆN APTIS','/luyen-aptis'],['thi','THI THỬ','/thi-thu']].map(t=>`<a class="${a===t[0]?'on':''}" href="#${S.get('last:'+t[0],t[2])}">${t[1]}</a>`).join('')}</nav><a class="btn" href="#/" onclick="goContact(event)" style="padding:10px 16px;font-size:13px">ĐĂNG KÝ TƯ VẤN</a></header>`}
function go(){const h=(location.hash||'#/').slice(1);
 if(prev==='/thi-thu/session'&&h!=='/thi-thu/session'&&h!=='/thi-thu/result'){const s=S.get('sess2',null);if(s&&s.status==='in_progress'&&!confirm('Phiên thi đang diễn ra và đồng hồ vẫn tiếp tục chạy. Bạn có chắc muốn rời phòng thi?')){history.replaceState(null,'','#'+prev);return}}
 prev=h;S.set('last:'+area(h),h);clearInterval(tick);stopMedia();shell(h);{const px=document.getElementById('px');px&&(px.style.display=area(h)==='luyen'?'block':'none')}window.scrollTo(0,0);
 if(h.startsWith('/luyen-aptis'))return practice();
 if(h.startsWith('/luyen-aptis'))return practice(h.split('/')[2]);
 if(h==='/thi-thu/session')return session();
 if(h.startsWith('/thi-thu/instructions'))return instr(h.split('/')[3]);
 if(h==='/thi-thu/result')return result();
 if(h.startsWith('/thi-thu'))return portal();
 home();fitBM();document.fonts&&document.fonts.ready.then(fitBM)}
function fitBM(){const a=document.getElementById('ba'),b=document.getElementById('bb');if(!a||!b)return;b.style.fontSize='';const f=parseFloat(getComputedStyle(b).fontSize);b.style.fontSize=(f*a.offsetWidth/b.offsetWidth)+'px'}
addEventListener('resize',fitBM);
addEventListener('hashchange',go);
// ---------- HOME ----------
function home(){$('#app').innerHTML=`<div class="home"><div class="frame">

<section class="hero"><div><div class="eye">BETMA ENGLISH · ENGLISH LEARNING PLATFORM</div>
<h1 class="bm"><span id="ba">BEGINNER</span><span class="to">TO</span><em id="bb">MASTER</em></h1>
<p style="max-width:460px">Đồng hành cùng bạn chinh phục TOEIC, VSTEP và APTIS thông qua lộ trình học tập hiện đại, chương trình đào tạo bài bản và trải nghiệm học tập hiệu quả.</p>
<a class="btn" href="#/" onclick="sc('programs');return false">Khám phá chương trình</a> <a class="btn o" href="#/thi-thu">Thi thử APTIS</a>
<div class="stats"><div><b>10.000+</b><span>Học viên</span></div><div><b>50+</b><span>Đối tác trong và ngoài nước</span></div></div>
</div>
<div class="col"><img alt="Lớp học BETMA" src="assets/img/class-1.jpg" style="left:0;top:0;width:52%;height:56%;object-position:50% 80%"><img alt="Học viên BETMA" src="assets/img/class-2.jpg" style="right:0;top:6%;width:46%;height:44%;border-radius:100px 28px 28px 28px;object-position:50% 85%"><img alt="Lớp học BETMA" src="assets/img/class-3.jpg" style="left:16%;bottom:0;width:62%;height:40%;object-position:50% 40%"></div></section>
<section class="sec"><h2>Về BETMA</h2><p style="max-width:640px">Nội dung giới thiệu, sứ mệnh, tầm nhìn và giá trị cốt lõi sẽ do Admin cung cấp. Mục này đang để trống để không đưa thông tin chưa có nguồn.</p></section>
<section class="sec" id="programs"><h2>Chương trình đào tạo</h2><div class="pl"><div>TOEIC<small>Chi tiết sắp có</small></div><div>TOEIC 4 Skills<small>Chi tiết sắp có</small></div><div>VSTEP B1<small>Chi tiết sắp có</small></div><div>APTIS B2<small>Chi tiết sắp có</small></div><div>IELTS<small>Chi tiết sắp có</small></div></div></section>
<div class="apt" style="margin-top:48px"><h2>Chủ động luyện tập, sẵn sàng chinh phục APTIS.</h2><a class="btn" style="background:#fff;color:var(--red)" href="#/luyen-aptis">Trải nghiệm luyện APTIS</a></div>
<section class="sec" id="contact"><h2>Đăng ký tư vấn</h2><div id="lead"><input class="tx" id="ln" placeholder="Họ và tên"><input class="tx" id="lp" placeholder="Số điện thoại"><button class="btn" onclick="lead()">Gửi đăng ký</button></div></section>
<footer class="ft"><span>${LOGO}</span><span>Liên hệ, địa chỉ, chính sách: chờ Admin cập nhật</span></footer></div></div>`}
function lead(){const n=$('#ln').value.trim(),p=$('#lp').value.trim();if(!n||!p){alert('Nhập họ tên và số điện thoại.');return}const l=S.get('leads',[]);l.push({n,p,at:Date.now()});S.set('leads',l);$('#lead').innerHTML='<p>Đã lưu đăng ký trên trình duyệt này (demo, chưa gửi tới máy chủ).</p>'}
// ---------- PRACTICE ----------
function phd(on){if(on==='')return '';return `<div class="ph"><b>APTIS PRACTICE</b><nav>${[['','Tất cả'],['grammar','Grammar & Vocabulary'],['listening','Listening'],['reading','Reading'],['writing','Writing'],['speaking','Speaking']].map(t=>`<a class="${(on||'')===t[0]?'on':''}" href="#/luyen-aptis${t[0]?'/'+t[0]:''}">${t[1]}</a>`).join('')}</nav></div>`}
function prog(){return S.get('attempts',[])}
function practiceOld(SK){SK=SK||'';const at=prog();
 const sk=Object.entries(DB.skills).filter(([k])=>!SK||k===SK).map(([k,s])=>`<h2 style="margin-bottom:0">${s.name}</h2><div class="g4">${s.parts.map((p,i)=>{const ex=DB.exercises.filter(e=>e.skill===k&&e.part===i+1);const done=ex.filter(e=>at.some(a=>a.ex===e.id)).length;const pc=ex.length?done/ex.length*100:0;
 return `<div class="card"><b>PART ${i+1}</b><div style="font-weight:700">${p}</div><div class="bar"><i style="width:${pc}%"></i></div><small>${done}/${ex.length} bài đã làm</small>${ex.map(e=>`<div style="margin-top:10px"><a class="btn" style="display:inline-block;padding:8px 14px;font-size:13px" href="#/luyen-aptis/exercise/${e.id}">${e.title.split(' · ')[0]}</a></div>`).join('')||'<div style="margin-top:10px;color:#888;font-size:13px">Chưa có bài trong Question Bank</div>'}</div>`}).join('')}</div>`).join('');
 const tot=at.length,cor=at.reduce((s,a)=>s+a.c,0),all=at.reduce((s,a)=>s+a.n,0);
 $('#app').innerHTML=`<div class="pg">${phd(SK)}<div class="wrap"><div class="ph1"><div><h1>Luyện Listening &amp; Reading theo đúng 4 Part của đề thi.</h1><p>Câu hỏi lấy từ ngân hàng đề BETMA. Bấm vào bất kỳ từ nào trong bài để xem nghĩa.</p></div>
<div class="card"><b>4 bước</b><ol style="padding-left:18px;margin:8px 0 0"><li>Chọn kỹ năng, Part và bài.</li><li>Chọn đáp án.</li><li>Bấm Kiểm tra để xem đúng/sai và giải thích.</li><li>Bấm Làm lại để luyện lần nữa.</li></ol></div></div>
<div class="card" style="margin-bottom:24px"><b>Tiến độ của bạn</b>: ${tot} lượt làm · ${cor}/${all} câu đúng${all?' · '+Math.round(cor/all*100)+'% chính xác':''}</div>${sk}
${['grammar','writing','speaking'].includes(SK)?'<div class="card">Chưa có bài trong Question Bank cho kỹ năng này.</div>':''}<p style="color:#888;font-size:13px">Grammar &amp; Vocabulary, Writing, Speaking: chưa có trong bản demo này.</p></div></div>`}

/* ngân hàng đề: xem js/bank.js */
// ---------- LUYỆN APTIS: ngân hàng đề (Listening P1-4, Reading P1-4) ----------
const PN={L1:['Information Recognition','Nghe 1 đoạn, chọn A/B/C','câu'],L2:['Information Matching','4 người nói, nối với 6 ý','topic'],L3:['Identifying Opinions','Hội thoại: Man / Woman / Both','topic'],L4:['Monologue Comprehension','Bài nói dài, 2 câu hỏi','topic'],R1:['Sentence Comprehension','Tin nhắn, chọn từ cho chỗ trống','bài'],R2:['Text Cohesion','Sắp xếp 5 câu theo thứ tự','bài'],R3:['Opinion Matching','4 người, 7 câu hỏi “Who…?”','bài'],R4:['Long Text Comprehension','7 đoạn, chọn tiêu đề','bài']};

const KT=['Heyerdahl believed that the Indonesian people had come from Peru. He said stone heads found on Easter Island were so similar to those around Lake Titicaca in Peru that there had to be a connection. But other scientists claimed that it would have been impossible for the Peruvians to make the journey across open sea. They said the stone figures had been made by Indonesians to frighten a local enemy they were fighting. Heyerdahl thought these battles were really between Indonesian natives and Peruvian invaders, and that the Peruvians could have made the journey. It was this that he wanted to prove.',
'Kon-Tiki was designed by copying pre-Columbian illustrations and paintings. It was built in Peru using local materials like wood, reeds and rope made from plants. There was no metal used at all in the construction. The finished boat was 15 metres long and 5 metres wide. The six-man crew, and a parrot called Lorita, shared a small cabin of 5 metres long and 2 metres wide. They also had to carry enough supplies for the 100-day crossing. They carried with them 1,250 litres of water and 200 coconuts as well as fruits and roots. The US Army had also given them emergency rations and survival equipment. Their diet was supplemented with the wide variety of fish that they were able to catch while at sea.',
'The crew members – four Norwegians and a Swede – who went with Heyerdahl included a steward, an engineer, a sociologist and translator, a guide and radio experts. The only modern equipment they carried was a compass and a radio, which was mainly used for giving weather reports and relaying their position to the Norwegian government.',
'They set out from the Peruvian sea port of Callao on April 28th, 1947. A navy boat pulled them 50 miles out to sea before releasing them. From there they sailed west, carried along by the Humbolt current. Their first sight of land, Puka-Puka island, was made 93 days later. Four days after that they saw Angatau Island and spoke to people from there but could not land. Finally, after 101 days at sea and sailing 6,980 kilometres, they touched dry land on the desert island of Raroia. However, people from nearby islands arrived in boats and took them to their village where they were welcomed with traditional dancing and parties.',
'Heyerdahl’s trip sparked a number of reactions in other scientists. They said that he and his team hadn’t sailed but drifted, and that it was chance that they reached their destination. They also claimed that there was more evidence that the people of the Indonesian islands had originally come from the West, and not from the East. However, as recently as 2011, genetic evidence has been found which supports Heyerdahl’s claims.',
'Since the Kon-Tiki’s ambitious crossing, there have been several similar expeditions. Not all of them were successful, but in 1970, the Spanish explorer, Vital Alsar, succeeded in crossing the Pacific Ocean in the longest recorded journey of its kind. Alsar was convinced that ancient sailors could read the ocean currents like road maps. He successfully proved the point in 1973 when he repeated the voyage. More recently still, a Norwegian team recreated the trip with a copy of Thor Heyerdahl’s craft and made an award-winning documentary of the experience.',
'Thor Heyerdahl’s impressive journey has captured the imagination of generations. His book, The Kon-Tiki expedition was published in 1948 and immediately became a best-seller. His documentary, made on 8mm film, taken during the journey and including interviews with the crew, won an Academy Award in 1951. The Kon-Tiki museum in Oslo is one of the most visited places in Norway. And as recently as 2012, Kon-Tiki, the most expensive Norwegian feature film of the journey, was nominated for an Oscar.'];
